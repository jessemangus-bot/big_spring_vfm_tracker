name: Deploy BGG VFM Frontend To GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "artifacts/bgg-vfm/**"
      - "lib/api-client-react/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-bgg-vfm-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
          dest: ~/setup-pnpm
          cache: false
          cache_dependency_path: pnpm-lock.yaml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Changed from '24' to '18', which is a supported version
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve base URL
        run: |
          if [ -n "${{ vars.EXPO_PUBLIC_BASE_URL }}" ]; then
            echo "EXPO_PUBLIC_BASE_URL=${{ vars.EXPO_PUBLIC_BASE_URL }}" >> "$GITHUB_ENV"
          else
            echo "EXPO_PUBLIC_BASE_URL=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - name: Validate API base URL
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_API_BASE_URL" ]; then
            echo "Missing EXPO_PUBLIC_API_BASE_URL. Set it as a repository variable or secret." >&2
            exit 1
          fi

      - name: Build web bundle
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL || secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: pnpm --filter @workspace/bgg-vfm run build:web

      - name: Ensure GitHub Pages compatibility
        run: |
          cp artifacts/bgg-vfm/dist/index.html artifacts/bgg-vfm/dist/404.html
          touch artifacts/bgg-vfm/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/bgg-vfm/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4