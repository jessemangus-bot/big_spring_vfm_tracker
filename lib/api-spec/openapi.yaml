openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bgg
    description: BoardGameGeek operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bgg/geeklist:
    get:
      operationId: getBggGeeklist
      tags: [bgg]
      summary: Fetch and parse a BGG geeklist
      description: Fetches a BGG geeklist via the XML API and returns parsed items filtered by username. BGG API auth is server-side via environment configuration.
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: string
          description: The BGG geeklist ID (extracted from the URL)
        - name: username
          in: query
          required: true
          schema:
            type: string
          description: BGG username to filter items by
        - name: realName
          in: query
          required: false
          schema:
            type: string
          description: Optional real name fallback used for matching "sold to" mentions
      responses:
        "200":
          description: Parsed geeklist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BggGeelist"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: BGG API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bgg/for-trade:
    get:
      operationId: getBggForTradeCollection
      tags: [bgg]
      summary: Fetch BGG collection items marked for trade
      description: Fetches a BGG user's collection and returns games marked for trade.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
          description: BGG username whose collection should be checked
      responses:
        "200":
          description: For-trade collection items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BggForTradeCollection"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: BGG API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bgg/geeklist/all-items:
    get:
      operationId: getBggGeeklistAllItems
      tags: [bgg]
      summary: Fetch all BGG geeklist items
      description: Fetches every item in a BGG geeklist, sorted alphabetically, and marks whether each item is related to the configured user.
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: string
          description: The BGG geeklist ID (extracted from the URL)
        - name: username
          in: query
          required: true
          schema:
            type: string
          description: BGG username used to identify related items
        - name: realName
          in: query
          required: false
          schema:
            type: string
          description: Optional real name fallback used for matching "sold to" mentions
      responses:
        "200":
          description: All geeklist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BggGeeklistAllItems"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: BGG API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bgg/auction/bids:
    get:
      operationId: getBggAuctionBids
      tags: [bgg]
      summary: Fetch auction bid standings for a geeklist
      description: Returns every item in a BGG geeklist auction with its current high bid, high bidder, and parsing-confidence flags. Optionally highlights a username's winning/outbid status.
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: string
          description: The BGG geeklist ID (extracted from the URL)
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Optional BGG username to compute winning/outbid status for
      responses:
        "200":
          description: Auction bid standings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BggAuctionBidsResponse"
        "202":
          description: BGG is still preparing the geeklist
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Missing listId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: BGG API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BggGeelist:
      type: object
      properties:
        listTitle:
          type: string
        totalItems:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BggItem"
      required:
        - listTitle
        - totalItems
        - items
    BggItem:
      type: object
      properties:
        id:
          type: string
        gameTitle:
          type: string
        price:
          type: number
        type:
          type: string
          enum: [sale, purchase, offer, auction]
        status:
          type: string
          enum: [listed, sold, withdrawn, expired]
        auctionStatus:
          type: string
          enum: [winning, outbid]
        myBid:
          type: number
        buyerSeller:
          type: string
        condition:
          type: string
        notes:
          type: string
      required:
        - id
        - gameTitle
        - price
        - type
        - status
    BggForTradeCollection:
      type: object
      properties:
        username:
          type: string
        totalForTrade:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BggForTradeItem"
      required:
        - username
        - totalForTrade
        - items
    BggForTradeItem:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        objectId:
          type: string
        gameTitle:
          type: string
        yearPublished:
          type: integer
        version:
          type: string
        language:
          type: string
        tradeCondition:
          type: string
        thumbnail:
          type: string
        image:
          type: string
        bggUrl:
          type: string
      required:
        - id
        - collectionId
        - objectId
        - gameTitle
    BggGeeklistAllItems:
      type: object
      properties:
        listTitle:
          type: string
        totalItems:
          type: integer
        relationshipCounts:
          $ref: "#/components/schemas/BggVfmRelationshipCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/BggVfmItem"
      required:
        - listTitle
        - totalItems
        - relationshipCounts
        - items
    BggVfmRelationshipCounts:
      type: object
      properties:
        mine:
          type: integer
        purchased:
          type: integer
        offer:
          type: integer
        auction:
          type: integer
        unrelated:
          type: integer
      required:
        - mine
        - purchased
        - offer
        - auction
        - unrelated
    BggVfmItem:
      type: object
      properties:
        id:
          type: string
        objectId:
          type: string
        gameTitle:
          type: string
        price:
          type: number
        seller:
          type: string
        status:
          type: string
          enum: [listed, sold, withdrawn, expired]
        type:
          type: string
          enum: [sale, purchase]
        condition:
          type: string
        relationship:
          type: string
          enum: [mine, purchased, offer, auction, unrelated]
        bggUrl:
          type: string
      required:
        - id
        - gameTitle
        - price
        - seller
        - status
        - type
        - relationship
        - bggUrl
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    BggAuctionHighBid:
      type: object
      properties:
        amount:
          type: number
        username:
          type: string
        viaBin:
          type: boolean
        flags:
          type: array
          items:
            type: string
        raw:
          type: string
      required:
        - amount
        - username
        - viaBin
        - flags
        - raw
    BggAuctionBid:
      type: object
      properties:
        username:
          type: string
        amount:
          type: number
      required:
        - username
        - amount
    BggAuctionItem:
      type: object
      properties:
        id:
          type: string
        objectId:
          type: string
        gameTitle:
          type: string
        seller:
          type: string
        startingBid:
          type: number
        binPrice:
          type: number
        bidCount:
          type: integer
        highBid:
          oneOf:
            - $ref: "#/components/schemas/BggAuctionHighBid"
            - type: "null"
        yourStatus:
          type: string
          enum: [winning, outbid]
          nullable: true
        yourBest:
          type: number
          nullable: true
        bids:
          type: array
          items:
            $ref: "#/components/schemas/BggAuctionBid"
        bggUrl:
          type: string
      required:
        - id
        - gameTitle
        - seller
        - startingBid
        - binPrice
        - bidCount
        - bids
        - bggUrl
    BggAuctionBidsResponse:
      type: object
      properties:
        listId:
          type: string
        listTitle:
          type: string
        totalItems:
          type: integer
        itemsWithBids:
          type: integer
        highBidTotal:
          type: number
        yourWinning:
          type: integer
          nullable: true
        yourOutbid:
          type: integer
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/BggAuctionItem"
      required:
        - listId
        - listTitle
        - totalItems
        - itemsWithBids
        - highBidTotal
        - items
