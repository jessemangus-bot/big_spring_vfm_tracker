openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bgg
    description: BoardGameGeek operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bgg/geeklist:
    get:
      operationId: getBggGeeklist
      tags: [bgg]
      summary: Fetch and parse a BGG geeklist
      description: Fetches a BGG geeklist via the XML API and returns parsed items filtered by username. BGG API auth is server-side via environment configuration.
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: string
          description: The BGG geeklist ID (extracted from the URL)
        - name: username
          in: query
          required: true
          schema:
            type: string
          description: BGG username to filter items by
        - name: realName
          in: query
          required: false
          schema:
            type: string
          description: Optional real name fallback used for matching "sold to" mentions
      responses:
        "200":
          description: Parsed geeklist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BggGeelist"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: BGG API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bgg/for-trade:
    get:
      operationId: getBggForTradeCollection
      tags: [bgg]
      summary: Fetch BGG collection items marked for trade
      description: Fetches a BGG user's collection and returns games marked for trade.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
          description: BGG username whose collection should be checked
      responses:
        "200":
          description: For-trade collection items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BggForTradeCollection"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server configuration error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: BGG API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BggGeelist:
      type: object
      properties:
        listTitle:
          type: string
        totalItems:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BggItem"
      required:
        - listTitle
        - totalItems
        - items
    BggItem:
      type: object
      properties:
        id:
          type: string
        gameTitle:
          type: string
        price:
          type: number
        type:
          type: string
          enum: [sale, purchase, offer, auction]
        status:
          type: string
          enum: [listed, sold, withdrawn, expired]
        auctionStatus:
          type: string
          enum: [winning, outbid]
        myBid:
          type: number
        buyerSeller:
          type: string
        condition:
          type: string
        notes:
          type: string
      required:
        - id
        - gameTitle
        - price
        - type
        - status
    BggForTradeCollection:
      type: object
      properties:
        username:
          type: string
        totalForTrade:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/BggForTradeItem"
      required:
        - username
        - totalForTrade
        - items
    BggForTradeItem:
      type: object
      properties:
        id:
          type: string
        collectionId:
          type: string
        objectId:
          type: string
        gameTitle:
          type: string
        yearPublished:
          type: integer
        thumbnail:
          type: string
        image:
          type: string
        bggUrl:
          type: string
      required:
        - id
        - collectionId
        - objectId
        - gameTitle
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
