kind = "mobile"
previewPath = "/"
title = "BGG VFM Tracker"
version = "1.0.0"
id = "artifacts/bgg-vfm"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22352

[services.development]
run = "pnpm --filter @workspace/bgg-vfm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bgg-vfm", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bgg-vfm", "run", "serve" ]

[services.env]
PORT = "22352"
BASE_PATH = "/"
